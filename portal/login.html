<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>课表管理系统 · 登录</title><style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:#0f1117;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  .box{width:340px;background:#1a1d27;border:1px solid #2b3042;border-radius:16px;padding:32px 28px;color:#e6e6f0}
  .logo{text-align:center;font-size:22px;font-weight:700;margin-bottom:6px}
  .sub{text-align:center;color:#8a8fa8;font-size:12px;margin-bottom:24px}
  label{display:block;font-size:12px;color:#8a8fa8;margin:14px 0 6px}
  input{width:100%;padding:10px 12px;border-radius:9px;border:1px solid #2b3042;background:#0f1117;color:#e6e6f0;font-size:14px;outline:none}
  input:focus{border-color:#4f7cff}
  button{width:100%;margin-top:22px;padding:11px;border:none;border-radius:9px;background:#4f7cff;color:#fff;font-size:15px;cursor:pointer}
  button:hover{opacity:.9}
  .msg{height:18px;color:#ff5470;font-size:12px;text-align:center;margin-top:12px}
</style></head><body>
<div class="box">
  <div class="logo">📅 课表管理系统</div>
  <div class="sub">独立管理门户 · 与 AstrBot 面板隔离</div>
  <div style="text-align:center;color:#4f7cff;font-size:13px;margin-bottom:10px">当前账号：{{USERNAME}}</div>
  <label>用户名</label><input id="user" autocomplete="username">
  <label>密码</label><input id="pwd" type="password" autocomplete="current-password">
  <button id="login">登 录</button>
  <div class="msg" id="msg"></div>
  <div style="text-align:center;color:#555;font-size:11px;margin-top:14px">登录页版本 v3.0.1（若未显示请强制刷新 Ctrl+F5）</div>
</div>
<script>
const $=s=>document.querySelector(s);
const btn=$('#login');
btn.onclick=async()=>{
  const msg=$('#msg');msg.textContent='';
  if(!$('#user').value||!$('#pwd').value){msg.textContent='请输入用户名和密码';return;}
  btn.textContent='登录中...';btn.disabled=true;
  try{
    console.log('发起登录请求...');
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:$('#user').value,password:$('#pwd').value})});
    console.log('登录响应状态:', r.status);
    const j=await r.json();
    console.log('登录响应:', j);
    if(j.ok&&j.token){console.log('登录成功，跳转 /app');location.href='/app';}
    else{msg.textContent=j.message||'登录失败';btn.textContent='登 录';btn.disabled=false;}
  }catch(e){
    console.error('登录异常:', e);
    msg.textContent='网络错误：'+e.message;
    btn.textContent='登 录';btn.disabled=false;
  }
};
$('#pwd').addEventListener('keydown',e=>{if(e.key==='Enter')btn.click();});
</script></body></html>
